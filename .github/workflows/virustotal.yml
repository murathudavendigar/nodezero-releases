# Scans each release's installer on VirusTotal and writes the result on the
# release page, between the <!-- virustotal ... --> and <!-- /virustotal -->
# lines. The website reads the JSON in the first line.
#
# The source of this file is docs/releases-workflows/virustotal.yml in the
# private app repo; `npm run release` copies it here. Edit it there.
#
# Needs the repo secret VIRUSTOTAL_API_KEY (a free VirusTotal account's key).
# Run it by hand from the Actions tab to scan an older release.
name: VirusTotal scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.39.0 (empty: the latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: virustotal-${{ github.event.release.tag_name || inputs.tag || 'latest' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan the installer and write the result on the release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        shell: python3 {0}
        run: |
          import hashlib, json, os, re, sys, time, urllib.error, urllib.request, uuid
          from datetime import datetime, timezone

          REPO, TAG = os.environ["REPO"], os.environ.get("TAG", "").strip()
          GH = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "nodezero-virustotal"}
          VT_KEY = os.environ.get("VT_KEY", "").strip()
          VT = "https://www.virustotal.com/api/v3"

          def call(method, url, headers, body=None):
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def gh(method, path, data=None):
              body = json.dumps(data).encode() if data is not None else None
              headers = dict(GH, **({"Content-Type": "application/json"} if body else {}))
              status, raw = call(method, f"https://api.github.com{path}", headers, body)
              if status >= 300:
                  sys.exit(f"GitHub {method} {path}: {status} {raw[:300]!r}")
              return json.loads(raw) if raw else None

          release = gh("GET", f"/repos/{REPO}/releases/tags/{TAG}" if TAG else f"/repos/{REPO}/releases/latest")
          setup = next((a for a in release["assets"] if a["name"].endswith("_x64-setup.exe")), None)
          if not setup:
              sys.exit(f"{release['tag_name']} has no *_x64-setup.exe")

          def write(state, text, **data):
              """Put the result block on the release page, replacing an old one."""
              meta = json.dumps(dict(state=state, **data), separators=(",", ":"))
              block = f"<!-- virustotal {meta} -->\n{text}\n<!-- /virustotal -->"
              body = gh("GET", f"/repos/{REPO}/releases/{release['id']}")["body"] or ""
              pattern = re.compile(r"<!-- virustotal .*?-->.*?<!-- /virustotal -->", re.S)
              if pattern.search(body):
                  body = pattern.sub(lambda _: block, body, count=1)
              elif "### Check the file\n" in body:
                  body = body.replace("### Check the file\n", f"### Check the file\n\n{block}\n", 1)
              else:
                  body = f"{body.rstrip()}\n\n{block}\n"
              gh("PATCH", f"/repos/{REPO}/releases/{release['id']}", {"body": body})
              print(f"{release['tag_name']}: {text}")

          # Download the installer and hash it.
          status, exe = call("GET", setup["url"], dict(GH, Accept="application/octet-stream"))
          if status >= 300:
              sys.exit(f"could not download {setup['name']}: {status}")
          sha = hashlib.sha256(exe).hexdigest()
          link = f"https://www.virustotal.com/gui/file/{sha}"
          unfinished = f"VirusTotal scan did not finish. [Look the file up on VirusTotal]({link})."

          if not VT_KEY:
              write("unfinished", unfinished, sha256=sha)
              sys.exit("the VIRUSTOTAL_API_KEY secret is not set")

          def vt(method, path, body=None, extra=None):
              status, raw = call(method, f"{VT}{path}", dict({"x-apikey": VT_KEY, "Accept": "application/json"}, **(extra or {})), body)
              return status, (json.loads(raw) if raw else {})

          def stats_of(attributes):
              s = attributes.get("last_analysis_stats") or attributes.get("stats") or {}
              flagged = s.get("malicious", 0) + s.get("suspicious", 0)
              engines = flagged + s.get("undetected", 0) + s.get("harmless", 0)
              return flagged, engines

          def file_report():
              status, data = vt("GET", f"/files/{sha}")
              if status == 404:
                  return None
              if status >= 300:
                  raise RuntimeError(f"VirusTotal file lookup: {status}")
              a = data["data"]["attributes"]
              return a if a.get("last_analysis_date") and stats_of(a)[1] > 0 else None

          try:
              report = file_report()
              if report is None:
                  # Not on VirusTotal yet: upload it (the free API takes files up to 32 MB).
                  boundary = uuid.uuid4().hex
                  form = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"{setup['name']}\"\r\n"
                          "Content-Type: application/octet-stream\r\n\r\n").encode() + exe + f"\r\n--{boundary}--\r\n".encode()
                  status, data = vt("POST", "/files", form, {"Content-Type": f"multipart/form-data; boundary={boundary}"})
                  if status >= 300:
                      raise RuntimeError(f"VirusTotal upload: {status} {str(data)[:300]}")
                  analysis = data["data"]["id"]
                  # The free API allows 4 requests a minute: ask every 30 s, for up to 15 minutes.
                  for _ in range(30):
                      time.sleep(30)
                      status, data = vt("GET", f"/analyses/{analysis}")
                      if status < 300 and data["data"]["attributes"].get("status") == "completed":
                          break
                  else:
                      raise RuntimeError("VirusTotal did not finish the analysis in 15 minutes")
                  time.sleep(15)
                  report = file_report() or data["data"]["attributes"]
              flagged, engines = stats_of(report)
              when = datetime.fromtimestamp(report.get("last_analysis_date") or report.get("date") or time.time(), timezone.utc)
              day = when.strftime("%Y-%m-%d")
              text = (f"**VirusTotal:** {flagged} of {engines} engines flagged this file "
                      f"(scanned {when.strftime('%b')} {when.day}, {when.year}). [See the report]({link}).")
              write("done", text, flagged=flagged, engines=engines, date=day, sha256=sha)
          except Exception as error:
              write("unfinished", unfinished, sha256=sha)
              sys.exit(str(error))
